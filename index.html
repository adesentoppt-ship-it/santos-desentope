<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santos Desentope</title>
<meta name="theme-color" content="#D71920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Santos Desentope">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div id="splash">
  <img src="icons/icon-512.png" alt="">
  <h1>Santos Desentope</h1>
</div>

<div id="login" class="hidden">
  <img src="icons/icon-192.png" alt="" class="login-logo">
  <h1>Santos Desentope</h1>
  <p>Escreve o teu PIN</p>
  <div class="pin-dots"><span></span><span></span><span></span><span></span></div>
  <div class="pin-err" id="pinErr"></div>
  <div class="keypad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <span></span><button>0</button><button data-k="del">⌫</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <img src="icons/icon-192.png" alt="">
    <div class="h-title"><b>Santos Desentope</b><small id="who"></small></div>
    <button id="btnBell" class="icon-btn" title="Notificações">🔔</button>
    <button id="btnSair" class="icon-btn" title="Sair">⎋</button>
  </header>
  <main id="view"></main>
  <button id="fab" class="fab hidden" aria-label="Novo trabalho">＋</button>
  <nav id="tabs"></nav>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
